<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" fill="none">
  <defs>
    <linearGradient id="bgMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="48%" stop-color="#0F294A" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="28%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="15%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#CCFBF1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bgMed)" />
  <rect width="1600" height="700" fill="url(#glowCyan)" />
  <rect width="1600" height="700" fill="url(#glowEmerald)" />

  <!-- Subtle architectural grid -->
  <g opacity="0.07" stroke="#BAE6FD" stroke-width="1">
    <path d="M0 140H1600 M0 280H1600 M0 420H1600 M0 560H1600" />
    <path d="M200 0V700 M400 0V700 M600 0V700 M800 0V700" />
  </g>

  <!-- Soft bokeh orbs -->
  <circle cx="230" cy="180" r="90" fill="#38BDF8" opacity="0.12" />
  <circle cx="540" cy="520" r="120" fill="#10B981" opacity="0.1" />
  <circle cx="430" cy="150" r="44" fill="#FFFFFF" opacity="0.08" />

  <!-- Left-side Editorial Medical Kit Composition -->
  <g transform="translate(115, 115)">
    <!-- Back card -->
    <rect x="130" y="30" width="330" height="410" rx="34" fill="#1E3A5F" fill-opacity="0.55" stroke="#7DD3FC" stroke-opacity="0.25" stroke-width="2" />

    <!-- Main Medical Aid Box -->
    <rect x="40" y="95" width="340" height="295" rx="32" fill="url(#boxGrad1)" />
    <rect x="40" y="95" width="340" height="78" rx="32" fill="#0284C7" fill-opacity="0.1" />
    <!-- Handle -->
    <path d="M160 95V72C160 58 172 48 186 48H234C248 48 260 58 260 72V95" stroke="#E0F2FE" stroke-width="16" stroke-linecap="round" />

    <!-- Medical Cross Circle -->
    <circle cx="210" cy="242" r="64" fill="url(#crossGrad)" />
    <rect x="197" y="204" width="26" height="76" rx="8" fill="#FFFFFF" />
    <rect x="172" y="229" width="76" height="26" rx="8" fill="#FFFFFF" />

    <!-- Secondary Medicine Vial & Box -->
    <rect x="330" y="210" width="165" height="210" rx="26" fill="url(#boxGrad2)" stroke="#A7F3D0" stroke-width="2" />
    <rect x="360" y="242" width="105" height="20" rx="10" fill="#10B981" fill-opacity="0.24" />
    <rect x="360" y="278" width="76" height="12" rx="6" fill="#0F766E" fill-opacity="0.22" />
    <rect x="360" y="302" width="90" height="12" rx="6" fill="#0F766E" fill-opacity="0.16" />

    <!-- Heartbeat Pulse Line -->
    <path d="M356 368H384L398 338L416 392L432 356L444 368H472" stroke="#059669" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floating Pill Capsule -->
    <g transform="translate(15, 320) rotate(-24)">
      <rect x="0" y="0" width="92" height="44" rx="22" fill="#FFFFFF" />
      <path d="M46 0H70C82.15 0 92 9.85 92 22C92 34.15 82.15 44 70 44H46V0Z" fill="#0EA5E9" />
    </g>

    <!-- Floating Stethoscope Accent Ring -->
    <circle cx="430" cy="115" r="46" fill="#0EA5E9" fill-opacity="0.22" stroke="#7DD3FC" stroke-opacity="0.5" stroke-width="2" />
    <path d="M414 102V118C414 127.94 422.06 136 432 136C441.94 136 450 127.94 450 118V102" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="432" cy="144" r="6" fill="#34D399" />
  </g>
</svg>
